server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS. Looking the api up per request (via the variable) lets nginx
    # start even when the api container is down, and follows it if it restarts.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3000;

    # API calls go to the api container, so the browser sees one origin (no CORS).
    location /v1/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # Overwrite rather than append, so a client cannot pass in a fake address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change, so browsers can keep them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /signup, /admin and any other path load the app, which picks the page.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
