services:
  api:
    build: 
      context: server
      dockerfile: Dockerfile
    env_file:
      - /server/.env
    ports:
      - "3000:${PORT}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
    



  db:
    image: postgres:16
    env_file:
      - /server/.env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data: