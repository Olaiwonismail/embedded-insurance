services:
  api:
    # The root, so the build can also bundle the widget the API serves.
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./server/.env
    environment:
      # Requests arrive through the web container's nginx; read the visitor's
      # address from it so the signup rate limit is per visitor, not shared.
      TRUST_PROXY: uniquelocal
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Signup and admin pages, served by nginx. Forwards /v1 to the api service.
  web:
    build:
      context: web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  # Only the api uses it, inside docker, so no port is opened on the host: a Redis
  # already running there on 6379 would block this one from starting.
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16
    env_file:
      - ./server/.env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data: